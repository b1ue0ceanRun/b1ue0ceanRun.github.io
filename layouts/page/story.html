<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#08111f">
  <meta name="description" content="{{ .Description }}">
  <title>{{ .Title }}</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #07101d;
      --ink: #dce4ec;
      --muted: #8c9aaa;
      --gold: #d7b477;
      --blue: #89a9c4;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 72% 8%, rgba(56, 82, 110, .34), transparent 28rem),
        linear-gradient(180deg, #050b14 0%, #091525 43%, #132333 72%, #b89970 100%);
      font-family: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", Georgia, serif;
      font-size: 18px;
      line-height: 2;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .18;
      background: repeating-linear-gradient(108deg, transparent 0 19px, rgba(182, 207, 226, .22) 20px, transparent 21px 43px);
      mask-image: linear-gradient(to bottom, #000 8%, #000 55%, transparent 82%);
    }

    .story-shell { position: relative; isolation: isolate; }

    .story-cover {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 4rem 1.5rem;
      text-align: center;
    }

    .story-cover::after {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 1px;
      height: 18vh;
      background: linear-gradient(transparent, rgba(215, 180, 119, .8));
    }

    .cover-inner { max-width: 42rem; }

    .coordinates {
      margin: 0 0 3rem;
      color: var(--gold);
      font: 500 .68rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .26em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.8rem, 8vw, 6.5rem);
      font-weight: 400;
      line-height: 1.12;
      letter-spacing: .09em;
      text-wrap: balance;
    }

    .cover-lead {
      margin: 2rem 0 0;
      color: #aab7c4;
      font-size: clamp(1rem, 2.5vw, 1.22rem);
      letter-spacing: .28em;
    }

    .cover-time {
      display: inline-flex;
      align-items: center;
      gap: .85rem;
      margin-top: 5rem;
      color: var(--muted);
      font: 500 .65rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .cover-time::before {
      content: "";
      width: 3rem;
      height: 1px;
      background: var(--gold);
    }

    .story-content {
      width: min(100% - 2.5rem, 43rem);
      margin: 0 auto;
      padding: 12vh 0 32vh;
    }

    .story-content > p {
      margin: 0 0 1.65em;
      text-wrap: pretty;
    }

    .story-content > h2 {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 12rem 0 4rem;
      color: var(--gold);
      font: 500 .72rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .38em;
    }

    .story-content > h2:first-child { margin-top: 0; }

    .story-content > h2::before {
      content: "";
      width: 2.8rem;
      height: 1px;
      background: currentColor;
      opacity: .65;
    }

    .story-content > h2 span { display: none; }

    .story-distance {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 1rem;
      margin: 4.5rem 0 !important;
      color: #9eafbe;
      font: 500 .68rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .story-distance i {
      height: 1px;
      background: repeating-linear-gradient(90deg, var(--gold) 0 3px, transparent 3px 8px);
      opacity: .7;
    }

    .story-time {
      margin: 6rem 0 4rem !important;
      color: #f0d6a8;
      font: 300 clamp(3rem, 12vw, 6rem)/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: -.07em;
    }

    .story-time small {
      display: block;
      margin-top: 1.2rem;
      color: var(--muted);
      font-size: .65rem;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    blockquote {
      margin: 5rem -2rem;
      padding: 2.5rem 2rem 2.5rem 2.4rem;
      border: 0;
      border-left: 1px solid var(--gold);
      background: linear-gradient(90deg, rgba(215, 180, 119, .07), transparent);
      color: #f0e9de;
      font-size: clamp(1.08rem, 3vw, 1.35rem);
    }

    blockquote p { margin: 0 0 1.4em; }
    blockquote p:last-child { margin-bottom: 0; }

    .epilogue {
      margin-top: 8rem;
      padding: 0;
      border: 0;
      background: none;
      text-align: center;
      font-size: clamp(1.25rem, 3.5vw, 1.7rem);
      line-height: 2;
    }

    .epilogue p:last-child {
      margin-top: 5rem;
      color: #2d2a28;
      font-size: clamp(1.45rem, 4vw, 2rem);
    }

    .story-footer {
      position: absolute;
      bottom: 3rem;
      left: 0;
      width: 100%;
      color: rgba(34, 30, 27, .62);
      text-align: center;
      font: 500 .62rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .25em;
      text-transform: uppercase;
    }

    .skip-link {
      position: fixed;
      top: .75rem;
      left: .75rem;
      z-index: 10;
      padding: .6rem .8rem;
      color: #08111f;
      background: #fff;
      transform: translateY(-180%);
    }

    .skip-link:focus { transform: translateY(0); }

    ::selection { color: #08111f; background: #dbc49d; }

    @media (max-width: 600px) {
      body { font-size: 16px; }
      .story-content { width: min(100% - 2.25rem, 43rem); }
      .story-content > h2 { margin-top: 8rem; }
      blockquote { margin-right: -.5rem; margin-left: -.5rem; }
      .cover-lead { letter-spacing: .18em; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#story">跳到正文</a>
  <main class="story-shell">
    <header class="story-cover" aria-labelledby="story-title">
      <div class="cover-inner">
        <p class="coordinates">48.137° N · 11.575° E</p>
        <h1 id="story-title">慕尼黑<br>天亮以前</h1>
        <p class="cover-lead">讲一个故事吧。</p>
        <p class="cover-time">A night from 02:00 to 06:00</p>
      </div>
    </header>
    <article class="story-content" id="story">
      {{ .Content }}
    </article>
    <footer class="story-footer">München · Ein Sommer</footer>
  </main>
</body>
</html>
